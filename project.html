<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project</title>
  <link rel="icon" type="image/png" href="assets/img/log0.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/project.css" />
</head>

<body>
  <div class="read-progress" id="readProgress"></div>

  <a href="index.html" class="back-btn">
    <i class="bi bi-chevron-left"></i> Back
  </a>

  <div class="proj-hero">
    <div class="proj-hero-bg"></div>
    <div class="proj-hero-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="proj-shot d-none d-md-block">
      <div id="shotCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators" id="shotDots"></div>
        <div class="carousel-inner" id="shotInner"></div>
      </div>
    </div>

    <div class="proj-hero-content col-12 col-md-7">
      <p class="proj-hero-label" id="heroLabel"></p>
      <h1 class="proj-hero-title" id="heroTitle"></h1>
      <p class="proj-hero-desc" id="heroDesc"></p>
      <div class="hero-cta-row">
        <a href="#" class="btn-hero-primary" id="heroGithub" target="_blank" rel="noopener">
          <i class="bi bi-github"></i> View Source
        </a>
        <a href="#overview" class="btn-hero-ghost">
          <i class="bi bi-arrow-down"></i> Explore Project
        </a>
      </div>
    </div>

    <div class="scroll-indicator">
      <span>Scroll</span>
      <i class="bi bi-chevron-compact-down"></i>
    </div>
  </div>

  <div class="cta-section">
    <div class="container-pd">
      <div class="reveal">
        <span class="sec-badge">Interested?</span>
        <h2 class="sec-h2">Check Out the <span class="hl">Code</span></h2>
        <p class="sec-sub">
          See the full source on GitHub or get in touch to collaborate.
        </p>
        <div class="cta-buttons">
          <a href="#" class="btn-hero-primary" id="ctaGithub" target="_blank" rel="noopener">
            <i class="bi bi-github"></i> View on GitHub
          </a>
          <a href="index.html#contact" class="btn-hero-ghost">
            <i class="bi bi-envelope-fill"></i> Get In Touch
          </a>
          <a href="index.html#projects" class="btn-hero-ghost">
            <i class="bi bi-grid-fill"></i> All Projects
          </a>
        </div>
      </div>
    </div>
  </div>

  <footer class="pd-footer">
    <p>
      &copy; <span id="footerYear"></span>
      <a href="index.html">snckish — Mae Abiera</a>
    </p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/project.js"></script>
</body>

</html>
